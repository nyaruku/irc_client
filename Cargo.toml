[workspace]
members = ["irc_library"]

[package]
name = "irc-client"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = "0.36.2"
irc_library = { version = "0.1.1", path = "irc_library" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1.44"
